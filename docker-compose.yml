services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
      POSTGRES_DB: video
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    environment:
      VIDEO_DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video
      VIDEO_BROKER_URL: redis://valkey:6379/0
      VIDEO_ARTIFACT_ROOT: /artifacts
      VIDEO_USE_FAKE_INFERENCE: "true"
    volumes: ["artifacts:/artifacts"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
  worker:
    build: .
    command: ["celery", "-A", "src.service.tasks", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      VIDEO_DATABASE_URL: postgresql+psycopg://video:video@postgres:5432/video
      VIDEO_BROKER_URL: redis://valkey:6379/0
      VIDEO_ARTIFACT_ROOT: /artifacts
      VIDEO_USE_FAKE_INFERENCE: "true"
    volumes: ["artifacts:/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
volumes:
  artifacts:
