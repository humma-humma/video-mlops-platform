[project]
name = "vlm-inference"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bert-score>=0.3.13",
    "moviepy>=2.2.1",
    "numpy>=2.4.1",
    "opencv-python-headless>=4.13.0.90",
    "pandas>=2.3.3",
    "scikit-learn>=1.8",
    "torch>=2.9",
    "transformers[accelerate]>=4.57.6",
]

[tool.uv.sources]
torch = { index = "pytorch", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
cache-dir = "/AIML/tinyllms/nobackup/.uv_cache"
