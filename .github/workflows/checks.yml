name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-service-test.lock.txt
      - run: python -m pip install -r requirements-service-test.lock.txt
      - run: python -m pytest -q
      - run: python -m scripts.replay_model_artifact_proposal
      - run: git apply --check proposals/model_artifact_build_gate.patch
      - name: Replay and score diagnostic challenge
        run: |
          python -m scripts.build_diagnostic_challenge
          python -m scripts.diagnostic_workbench evaluate --cases reports/diagnostics/challenge/cases.json --output /tmp/diagnostic-challenge-evaluation.json
          python -c "import json; r=json.load(open('/tmp/diagnostic-challenge-evaluation.json')); assert r['correct'] == r['total'] == 6 and r['citations_valid'] and r['false_confident'] == 0, r"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/demo_ui.test.cjs
      - run: node tests/operations_ui.test.cjs
      - run: git diff --check
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      VIDEO_S3_ENDPOINT_URL: http://minio:9090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Create a decodable fixture
        run: |
          docker compose exec -T api ffmpeg -v error -f lavfi -i color=size=64x64:rate=10 -t 1 -c:v mpeg4 /tmp/smoke.mp4
          docker compose cp api:/tmp/smoke.mp4 /tmp/smoke.mp4
      - run: python -m scripts.service_smoke --video /tmp/smoke.mp4 --restart-worker --check-failure --check-storage
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v
